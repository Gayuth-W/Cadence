spring:
  application:
    name: cadence-service

  # Java 21 virtual threads for the servlet container. Every request handler in this service is
  # I/O-bound (Postgres, Redis); none of them should occupy a platform thread while they wait.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${CADENCE_DB_URL:jdbc:postgresql://localhost:5432/cadence}
    username: ${CADENCE_DB_USER:cadence}
    password: ${CADENCE_DB_PASSWORD:cadence}
    hikari:
      maximum-pool-size: 20
      pool-name: cadence-pool

  jpa:
    open-in-view: false          # never hold a DB connection for the duration of view rendering
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks the mapping matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${CADENCE_REDIS_HOST:localhost}
      port: ${CADENCE_REDIS_PORT:6379}
      timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16

  jackson:
    default-property-inclusion: non_null

server:
  port: ${CADENCE_PORT:8080}
  shutdown: graceful             # drain in-flight event batches before the JVM exits
  error:
    include-message: never       # error bodies come from GlobalExceptionHandler, not the servlet container

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: cadence

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.cadence: INFO
    # Uncomment when debugging the release-health loop:
    # com.cadence.flagservice.metrics: DEBUG

cadence:
  environment: ${CADENCE_ENVIRONMENT:development}

  jwt:
    # No default. The application refuses to start without this; see JwtService#init.
    # Generate one with:  openssl rand -base64 48
    secret: ${CADENCE_JWT_SECRET:}
    expiration: PT8H
    issuer: cadence

  rollback:
    enabled: true
    check-interval: PT30S
    consecutive-breaches: 50     # 50 x 30s ~= 25 minutes of sustained degradation
    min-samples: 20
    cooldown: PT10M

  canary:
    enabled: true
    alpha: 0.05
    min-samples: 30              # below this the Mann-Whitney test has no power; the gate abstains
    window: LAST_1H
    max-samples: 5000

  metrics:
    snapshot-interval: PT5M
    max-window-size: 50000
    ingestion-concurrency: 512

  rollout:
    reconcile-interval: PT30S

  alerting:
    enabled: ${CADENCE_ALERTING_ENABLED:false}
    # A Slack webhook is a bearer credential. It lives in the environment, never in the repository.
    slack-webhook-url: ${CADENCE_SLACK_WEBHOOK_URL:}

